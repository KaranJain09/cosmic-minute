name: Render and publish

on:
  push:
    branches: [main]
    paths: ["scripts/episode_*.json"]
  schedule:
    - cron: "15 0 * * *" # 05:45 IST: backup in case the 4 AM push did not start a run
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: pip install -r requirements-cloud.txt

      - name: Render pending episodes
        id: render
        continue-on-error: true
        run: python tools/cloud.py render

      - name: Save history
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series_history.json "upload videos/*.txt"
          if ! git diff --cached --quiet; then
            git commit -m "Update render status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build web app
        if: ${{ !cancelled() }}
        run: python tools/cloud.py site

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site

      - name: Deploy web app
        id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4

      - name: Report render failure
        if: ${{ steps.render.outcome == 'failure' }}
        run: |
          echo "One or more episodes failed to render. See the Render pending episodes step."
          exit 1
