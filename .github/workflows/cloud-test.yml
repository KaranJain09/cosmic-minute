name: Cloud render test

# Manual check: renders an existing episode with the real voice. Publishes nothing and changes no history.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: Episode number to test
        default: "5"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: pip install -r requirements-cloud.txt
      - name: Render with the real voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python build_video.py --script "scripts/episode_${{ inputs.episode }}.json" --force
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-test-video
          path: upload videos/*.mp4
          retention-days: 1
