# Channel + pipeline settings. Episode JSON fields override these per episode.

channel:
  niche: "Space & science"
  series_title: "Cosmic Minute"
  youtube_handle: "@realcosmicminute"
  instagram_handle: "@real_cosmic_min"
  default_hashtags: ["#space", "#science", "#universe", "#astronomy", "#facts", "#shorts"]

paths:
  output_dir: "upload videos"
  scripts_dir: "scripts"
  build_dir: "build"
  history: "series_history.json"

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: "veryfast"
  audio_bitrate: "192k"

tts:
  engine: "edge"                  # kokoro (free local) | edge (free online) | elevenlabs | dummy (offline test beeps)
  kokoro:                         # run voice_samples.py to hear the options
    voice: "am_michael"           # US: am_michael am_fenrir am_puck af_heart af_bella | UK: bm_george bm_fable bf_emma
    speed: 1.05
  edge:
    voice: "hi-IN-SwaraNeural"   # chosen by user 2026-11-25 (Hinglish). Reads scene "speech" (Hindi script)
    rate: "+12%"
    pitch: "+0Hz"
    volume: "+0%"
    # Free "emotion": each scene's delivery changes speed and pitch (edge-tts has no emotion styles).
    # Scene "delivery" picks one; otherwise hook=excited, twist=shock, cta=question, rest=normal.
    delivery:
      normal:   { rate: "+12%", pitch: "+0Hz" }
      excited:  { rate: "+20%", pitch: "+8Hz", volume: "+5%" }
      curious:  { rate: "+8%",  pitch: "+4Hz" }
      shock:    { rate: "+2%",  pitch: "-3Hz" }
      serious:  { rate: "+4%",  pitch: "-5Hz" }
      question: { rate: "+10%", pitch: "+6Hz" }
  fallback: "edge"                # used automatically if the main engine fails (no key, out of credits)
  elevenlabs:                     # key: GitHub secret / .env ELEVENLABS_API_KEY (Starter plan, 30k credits/month)
    voice_id: "7b9mYhmnp0y2qSH1FnBL"   # Bunty - Funny Best Friend (Hindi). Placeholder until the user picks
    model_id: "eleven_v3"         # expressive: understands [excited] [whispers] [laughs] tags in `speech`
    stability: 0.5                # v3 accepts 0.0 (creative), 0.5 (natural), 1.0 (robust)

visuals:
  default_backend: "nasa"         # nasa (real NASA photos, no key) | stock (Pexels video) | kenburns (own image) | kinetic
  palette:
    bg_top: "#04030C"
    bg_bottom: "#140B3A"
    nebula: ["#3B1E8C", "#0E4D7A", "#7A1E5C", "#1E3A8C"]
    accent: "#FFD400"
    accent2: "#4FC3F7"
    text: "#FFFFFF"
  on_screen_text_y: 0.34          # fraction of height (center of text block)
  stock:
    provider: "pexels"            # needs PEXELS_API_KEY in .env, falls back to kinetic

fonts:
  display: { file: "assets/fonts/Anton-Regular.ttf" }
  caption: { file: "assets/fonts/Montserrat-Variable.ttf", variation: "ExtraBold" }
  ui:      { file: "assets/fonts/Montserrat-Variable.ttf", variation: "Bold" }

captions:
  size: 76
  max_words: 3
  max_chars: 20
  y: 0.62                         # fraction of height (center of caption)
  uppercase: true
  color: "#FFFFFF"
  highlight: "#FFD400"
  stroke: 6
  box_opacity: 0.55

audio:
  sample_rate: 48000
  pad_after_default: 0.08         # silence after each scene's line (s); short = fast pace
  music_dir: "assets/music"       # drop royalty-free .mp3/.wav here
  music_under_speech_db: -20      # music level relative to voice while speaking
  music_gaps_db: -14              # music level relative to voice in pauses
  fallback_music: "ambient"       # ambient (generated drone) | none
  whoosh: true                    # soft whoosh on each scene cut
  whoosh_db: -24
  loudness_lufs: -14

overlay:
  badge: true                     # small channel name at top (no episode number)
  cta_text: "COMMENT YOUR ANSWER"
  follow_text: "FOLLOW FOR DAILY SPACE"
